---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
  name: connections
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/app: connectionservice
    app.kubernetes.io/component: connectionservice
  name: connectionservice
  namespace: connections
spec:
  minReadySeconds: 5
  selector:
    matchLabels:
      app.kubernetes.io/app: connectionservice
      app.kubernetes.io/component: connectionservice
  template:
    metadata:
      labels:
        app.kubernetes.io/app: connectionservice
        app.kubernetes.io/component: connectionservice
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/worker
                operator: Exists
      automountServiceAccountToken: false
      hostUsers: false
      containers:
      - image: ghcr.io/dune-daq/connectivityserver:develop
        name: connectionservice
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
          protocol: TCP
        resources:
          limits:
            memory: 512Mi
          requests:
            memory: 8Mi
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        securityContext:
          runAsUser: 10000
          runAsGroup: 10000
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      securityContext:
        fsGroup: 10000
      volumes:
      - emptyDir:
          sizeLimit: 500Mi
        name: tmp
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/app: connectionservice
    app.kubernetes.io/component: connectionservice
  name: connectionservice
  namespace: connections
spec:
  ports:
  - name: http
    protocol: TCP
    port: 5000
    targetPort: http
  selector:
    app.kubernetes.io/app: connectionservice
    app.kubernetes.io/component: connectionservice
  type: ClusterIP
